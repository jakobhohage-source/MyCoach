document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

font-weight:600;cursor:pointer\">\n              <span style=\"width:10px;height:10px;border-radius:50%;background:{{ pt.dot }};flex:none\"><\u002Fspan>{{ pt.label }}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Pen colors -->\n      <sc-if value=\"{{ showPen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,0.25)\">\n          <span style=\"font-size:12px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:1px\">Farbe<\u002Fspan>\n          <sc-for list=\"{{ penColors }}\" as=\"pc\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ pc.tap }}\" style=\"width:34px;height:34px;border-radius:50%;background:{{ pc.c }};border:3px solid {{ pc.ring }};cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12)\"><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Save dialog -->\n  <sc-if value=\"{{ showSave }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeSaveBackdrop }}\" style=\"position:fixed;inset:0;background:rgba(17,24,39,0.45);z-index:500;display:flex;align-items:center;justify-content:center\">\n      <div style=\"background:#fff;border-radius:16px;padding:28px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3)\">\n        <div style=\"font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px\">Übung speichern<\u002Fdiv>\n        <div style=\"font-size:14px;color:#6b7280;margin-bottom:20px\">Die Übung wird auf diesem Gerät gespeichert und ist unter „Meine Übungen“ abrufbar.<\u002Fdiv>\n        <label style=\"font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#9ca3af;font-weight:700;display:block;margin-bottom:7px\">Name<\u002Flabel>\n        <input ref=\"{{ nameRef }}\" placeholder=\"z.B. Rondo 6+2 mit Pressing\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #e5e7eb;font-family:'Source Sans 3',sans-serif;font-size:15px;outline:none;margin-bottom:20px\">\n        <div style=\"display:flex;gap:10px\">\n          <button onclick=\"{{ confirmSave }}\" style=\"flex:1;background:#111827;color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:0.4px;cursor:pointer\">Speichern<\u002Fbutton>\n          <button onclick=\"{{ closeSave }}\" style=\"background:none;border:1px solid #e5e7eb;border-radius:10px;padding:13px 20px;font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:600;color:#374151;cursor:pointer\">Abbrechen<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Toast -->\n  <sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:12px 24px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.3);z-index:600;pointer-events:none\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showHints&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Board&quot;}}\">\nconst LS_KEY = 'mycoach-proto-uebungen';\n\nclass Component extends DCLogic {\n  state = {\n    tool: 'player', runType: 'straight', passType: 'pass', penColor: '#f0bc2e',\n    entities: [], paths: [], fieldW: 900, fieldH: 583,\n    showSave: false, showLib: false, showPresets: false, toast: '', savedList: []\n  };\n\n  fieldRef = React.createRef();\n  canvasRef = React.createRef();\n  areaRef = React.createRef();\n  nameRef = React.createRef();\n  history = [];\n  temp = null;\n  draggingId = null;\n  erasing = false;\n\n  hints = {\n    move: 'Spieler, Ball oder Hütchen antippen und mit dem Finger verschieben',\n    player: 'Tippe aufs Feld — dort wird ein Spieler (rot) gesetzt',\n    opponent: 'Tippe aufs Feld — dort wird ein Gegenspieler (blau) gesetzt',\n    ball: 'Tippe aufs Feld, um einen Ball zu platzieren',\n    cone: 'Tippe aufs Feld, um ein Hütchen zu setzen',\n    run: 'Vom Spieler zum Ziel ziehen — unten Gerade oder Bogen wählen',\n    pass: 'Vom Ball zum Ziel ziehen — der Pass wird eingezeichnet',\n    pen: 'Mit dem Finger frei aufs Feld zeichnen',\n    eraser: 'Über Linien oder Objekte wischen, um sie zu löschen'\n  };\n\n  componentDidMount() {\n    this.onResize = () => {\n      const a = this.areaRef.current;\n      if (!a) return;\n      const aw = a.clientWidth - 32, ah = a.clientHeight - 32;\n      let w = Math.min(aw, ah * 105 / 68);\n      let h = w * 68 / 105;\n      this.setState({ fieldW: Math.round(w), fieldH: Math.round(h) });\n    };\n    window.addEventListener('resize', this.onResize);\n    this.onResize();\n    this.setState({ savedList: this.readSaved() });\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }\n\n  componentDidUpdate() {\n    const c = this.canvasRef.current;\n    if (c && (c.width !== this.state.fieldW || c.height !== this.state.fieldH)) {\n      c.width = this.state.fieldW; c.height = this.state.fieldH;\n    }\n    this.redraw();\n  }\n\n  // ── geometry helpers ──\n  toPct(e) {\n    const r = this.fieldRef.current.getBoundingClientRect();\n    return { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 100 };\n  }\n  toPx(p) { return { x: p.x / 100 * this.state.fieldW, y: p.y / 100 * this.state.fieldH }; }\n  distPx(a, b) { const A = this.toPx(a), B = this.toPx(b); return Math.hypot(A.x - B.x, A.y - B.y); }\n  hit(p, radius) {\n    const P = this.toPx(p);\n    let best = null, bd = radius || 26;\n    for (const en of this.state.entities) {\n      const E = this.toPx({ x: en.x, y: en.y });\n      const d = Math.hypot(P.x - E.x, P.y - E.y);\n      if (d < bd) { bd = d; best = en; }\n    }\n    return best;\n  }\n  snap(p) { const h = this.hit(p, 30); return h ? { x: h.x, y: h.y } : p; }\n\n  pushHistory() {\n    this.history.push({ entities: this.state.entities, paths: this.state.paths });\n    if (this.history.length > 60) this.history.shift();\n  }\n\n  // ── pointer handlers ──\n  down = (e) => {\n    if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} }\n    const p = this.toPct(e);\n    const t = this.state.tool;\n    if (t === 'player' || t === 'opponent') {\n      this.pushHistory();\n      const num = this.state.entities.filter(x => x.type === t).length + 1;\n      this.setState({ entities: [...this.state.entities, { id: Date.now() + Math.random(), type: t, x: p.x, y: p.y, num }] });\n      return;\n    }\n    if (t === 'ball' || t === 'cone') {\n      this.pushHistory();\n      this.setState({ entities: [...this.state.entities, { id: Date.now() + Math.random(), type: t, x: p.x, y: p.y }] });\n      return;\n    }\n    if (t === 'move') {\n      const h = this.hit(p, 30);\n      if (h) { this.pushHistory(); this.draggingId = h.id; }\n      return;\n    }\n    if (t === 'eraser') { this.erasing = true; this.pushHistory(); this.eraseAt(p); return; }\n    if (t === 'pen') { this.temp = { kind: 'pen', color: this.state.penColor, pts: [p] }; return; }\n    if (t === 'run') { this.temp = { kind: 'run', curve: this.state.runType, from: this.snap(p), to: p }; return; }\n    if (t === 'pass') { this.temp = { kind: 'pass', ptype: this.state.passType, from: this.snap(p), to: p }; return; }\n  };\n\n  move = (e) => {\n    if (!this.temp && !this.draggingId && !this.erasing) return;\n    const p = this.toPct(e);\n    p.x = Math.max(0, Math.min(100, p.x));\n    p.y = Math.max(0, Math.min(100, p.y));\n    if (this.draggingId) {\n      this.setState({ entities: this.state.entities.map(x => x.id === this.draggingId ? { ...x, x: p.x, y: p.y } : x) });\n      return;\n    }\n    if (this.erasing) { this.eraseAt(p); return; }\n    if (this.temp) {\n      if (this.temp.kind === 'pen') this.temp.pts.push(p);\n      else this.temp.to = p;\n      this.redraw();\n    }\n  };\n\n  up = () => {\n    if (this.draggingId) { this.draggingId = null; return; }\n    if (this.erasing) { this.erasing = false; return; }\n    if (this.temp) {\n      const t = this.temp; this.temp = null;\n      const valid = t.kind === 'pen' ? t.pts.length > 1 : this.distPx(t.from, t.to) > 14;\n      if (valid) { this.pushHistory(); this.setState({ paths: [...this.state.paths, t] }); }\n      else this.redraw();\n    }\n  };\n\n  eraseAt(p) {\n    const P = this.toPx(p);\n    const keepPaths = this.state.paths.filter(pa => !this.pathNear(pa, P));\n    const keepEnts = this.state.entities.filter(en => {\n      const E = this.toPx({ x: en.x, y: en.y });\n      return Math.hypot(P.x - E.x, P.y - E.y) > 20;\n    });\n    if (keepPaths.length !== this.state.paths.length || keepEnts.length !== this.state.entities.length) {\n      this.setState({ paths: keepPaths, entities: keepEnts });\n    }\n  }\n  pathNear(pa, P) {\n    const pts = pa.kind === 'pen' ? pa.pts : this.sample(pa);\n    return pts.some(q => { const Q = this.toPx(q); return Math.hypot(P.x - Q.x, P.y - Q.y) < 14; });\n  }\n  ctrl(pa) {\n    const mx = (pa.from.x + pa.to.x) / 2, my = (pa.from.y + pa.to.y) / 2;\n    const curve = pa.kind === 'run' ? pa.curve : (pa.ptype === 'cross' ? 'arcl' : 'straight');\n    if (curve === 'straight') return { x: mx, y: my };\n    const dx = pa.to.x - pa.from.x, dy = pa.to.y - pa.from.y;\n    const s = curve === 'arcl' ? -0.3 : 0.3;\n    return { x: mx - dy * s, y: my + dx * s };\n  }\n  sample(pa) {\n    const out = [], c = this.ctrl(pa);\n    for (let i = 0; i <= 20; i++) {\n      const t = i / 20;\n      out.push({\n        x: (1 - t) * (1 - t) * pa.from.x + 2 * (1 - t) * t * c.x + t * t * pa.to.x,\n        y: (1 - t) * (1 - t) * pa.from.y + 2 * (1 - t) * t * c.y + t * t * pa.to.y\n      });\n    }\n    return out;\n  }\n\n  redraw() {\n    const c = this.canvasRef.current;\n    if (!c) return;\n    const ctx = c.getContext('2d');\n    ctx.clearRect(0, 0, c.width, c.height);\n    for (const pa of this.state.paths) this.drawPath(ctx, pa);\n    if (this.temp) this.drawPath(ctx, this.temp);\n  }\n  drawPath(ctx, pa) {\n    ctx.lineCap = 'round'; ctx.lineJoin = 'round';\n    if (pa.kind === 'pen') {\n      ctx.strokeStyle = pa.color; ctx.lineWidth = 3.5; ctx.setLineDash([]);\n      ctx.beginPath();\n      pa.pts.forEach((q, i) => { const Q = this.toPx(q); i ? ctx.lineTo(Q.x, Q.y) : ctx.moveTo(Q.x, Q.y); });\n      ctx.stroke();\n      return;\n    }\n    const from = this.toPx(pa.from), to = this.toPx(pa.to), C = this.toPx(this.ctrl(pa));\n    let color, dash, width;\n    if (pa.kind === 'run') { color = '#f0bc2e'; dash = [10, 8]; width = 3; }\n    else {\n      color = pa.ptype === 'cross' ? '#4fa3e0' : pa.ptype === 'shot' ? '#e8614e' : '#5dda8c';\n      dash = []; width = pa.ptype === 'shot' ? 4.5 : 3;\n    }\n    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);\n    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.quadraticCurveTo(C.x, C.y, to.x, to.y); ctx.stroke();\n    ctx.setLineDash([]);\n    const ang = Math.atan2(to.y - C.y, to.x - C.x), L = 12;\n    ctx.fillStyle = color;\n    ctx.beginPath();\n    ctx.moveTo(to.x, to.y);\n    ctx.lineTo(to.x - L * Math.cos(ang - 0.45), to.y - L * Math.sin(ang - 0.45));\n    ctx.lineTo(to.x - L * Math.cos(ang + 0.45), to.y - L * Math.sin(ang + 0.45));\n    ctx.closePath(); ctx.fill();\n  }\n\n  // ── actions ──\n  undo = () => { const h = this.history.pop(); if (h) this.setState({ entities: h.entities, paths: h.paths }); };\n  clearAll = () => { this.pushHistory(); this.setState({ entities: [], paths: [], showPresets: false, showLib: false }); };\n\n  applyPreset(id) {\n    this.pushHistory();\n    let ents = [], paths = [];\n    const mk = (type, x, y, num) => ({ id: Date.now() + Math.random() + x, type, x, y, num });\n    if (id === 'rondo') {\n      const cx = 26, cy = 50, r = 16;\n      for (let i = 0; i < 6; i++) {\n        const a = i / 6 * Math.PI * 2 - Math.PI / 2;\n        ents.push(mk('player', cx + Math.cos(a) * r, cy + Math.sin(a) * r * 1.35, i + 1));\n      }\n      ents.push(mk('opponent', cx - 3, cy - 5, 1));\n      ents.push(mk('opponent', cx + 3, cy + 5, 2));\n      ents.push(mk('ball', cx, cy - 20));\n    } else if (id === 'viereck') {\n      ents = [mk('player', 60, 25, 1), mk('player', 88, 25, 2), mk('player', 88, 75, 3), mk('player', 60, 75, 4), mk('ball', 60, 21)];\n      paths = [\n        { kind: 'pass', ptype: 'pass', from: { x: 60, y: 25 }, to: { x: 88, y: 25 } },\n        { kind: 'pass', ptype: 'pass', from: { x: 88, y: 25 }, to: { x: 88, y: 75 } },\n        { kind: 'pass', ptype: 'pass', from: { x: 88, y: 75 }, to: { x: 60, y: 75 } },\n        { kind: 'pass', ptype: 'pass', from: { x: 60, y: 75 }, to: { x: 60, y: 25 } }\n      ];\n    } else if (id === 'slalom') {\n      ents = [mk('player', 8, 50, 1), mk('ball', 8, 55)];\n      for (let i = 0; i < 5; i++) ents.push(mk('cone', 18 + i * 8, i % 2 ? 42 : 58));\n      paths = [{ kind: 'run', curve: 'straight', from: { x: 8, y: 50 }, to: { x: 62, y: 50 } }];\n    }\n    this.setState({ entities: ents, paths, showPresets: false });\n    this.showToast('Vorlage geladen');\n  }\n\n  // ── save / load ──\n  readSaved() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (_) { return []; } }\n  writeSaved(list) { localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 30))); }\n  confirmSave = () => {\n    const name = ((this.nameRef.current && this.nameRef.current.value) || '').trim() || 'Unbenannte Übung';\n    const list = this.readSaved();\n    list.unshift({ name, date: new Date().toLocaleDateString('de-DE'), entities: this.state.entities, paths: this.state.paths });\n    this.writeSaved(list);\n    this.setState({ showSave: false, savedList: this.readSaved() });\n    this.showToast('„' + name + '“ gespeichert');\n  };\n  showToast(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._tt);\n    this._tt = setTimeout(() => this.setState({ toast: '' }), 2200);\n  }\n\n  mk2(key, id) {\n    const active = this.state[key] === id;\n    return {\n      bg: active ? '#111827' : '#ffffff',\n      fg: active ? '#ffffff' : '#374151',\n      bd: active ? '#111827' : '#e5e7eb',\n      tap: () => this.setState({ [key]: id, showPresets: false, showLib: false })\n    };\n  }\n\n  renderVals() {\n    const st = this.state;\n    const t = {};\n    ['move', 'player', 'opponent', 'ball', 'cone', 'run', 'pass', 'pen', 'eraser'].forEach(id => { t[id] = this.mk2('tool', id); });\n\n    const players = st.entities.filter(e => e.type === 'player' || e.type === 'opponent')\n      .map(e => ({ l: e.x + '%', t: e.y + '%', bg: e.type === 'player' ? '#e8614e' : '#4fa3e0', num: e.num }));\n    const cones = st.entities.filter(e => e.type === 'cone').map(e => ({ l: e.x + '%', t: e.y + '%' }));\n    const balls = st.entities.filter(e => e.type === 'ball').map(e => ({ l: e.x + '%', t: e.y + '%' }));\n\n    const passTypes = [\n      { id: 'pass', label: 'Pass', dot: '#5dda8c' },\n      { id: 'cross', label: 'Flanke', dot: '#4fa3e0' },\n      { id: 'shot', label: 'Schuss', dot: '#e8614e' }\n    ].map(d => Object.assign({ label: d.label, dot: d.dot }, this.mk2('passType', d.id)));\n\n    const penColors = ['#ffffff', '#f0bc2e', '#e8614e', '#4fa3e0', '#5dda8c'].map(c => ({\n      c, ring: st.penColor === c ? '#111827' : '#e5e7eb',\n      tap: () => this.setState({ penColor: c })\n    }));\n\n    const presets = [\n      { label: 'Rondo 6+2 — Kreis', tap: () => this.applyPreset('rondo') },\n      { label: 'Passviereck — 4 Spieler', tap: () => this.applyPreset('viereck') },\n      { label: 'Hütchen-Slalom', tap: () => this.applyPreset('slalom') }\n    ];\n\n    const savedItems = st.savedList.map((s, i) => ({\n      name: s.name,\n      meta: s.date + ' · ' + s.entities.length + ' Objekte · ' + s.paths.length + ' Wege',\n      load: () => { this.pushHistory(); this.setState({ entities: s.entities, paths: s.paths, showLib: false }); this.showToast('„' + s.name + '“ geladen'); },\n      del: () => { const list = this.readSaved(); list.splice(i, 1); this.writeSaved(list); this.setState({ savedList: this.readSaved() }); }\n    }));\n\n    return {\n      t, players, cones, balls, passTypes, penColors, presets, savedItems,\n      libEmpty: savedItems.length === 0,\n      fieldW: st.fieldW, fieldH: st.fieldH,\n      hint: this.hints[st.tool],\n      showHints: this.props.showHints ?? true,\n      showRun: st.tool === 'run',\n      showPass: st.tool === 'pass',\n      showPen: st.tool === 'pen',\n      runOpt: {\n        straight: this.mk2('runType', 'straight'),\n        arcl: this.mk2('runType', 'arcl'),\n        arcr: this.mk2('runType', 'arcr')\n      },\n      cursor: st.tool === 'move' ? 'grab' : 'crosshair',\n      areaRef: this.areaRef, fieldRef: this.fieldRef, canvasRef: this.canvasRef, nameRef: this.nameRef,\n      down: this.down, move: this.move, up: this.up,\n      undo: this.undo, clearAll: this.clearAll,\n      togglePresets: () => this.setState({ showPresets: !st.showPresets, showLib: false }),\n      toggleLib: () => this.setState({ showLib: !st.showLib, showPresets: false, savedList: this.readSaved() }),\n      openSave: () => this.setState({ showSave: true, showPresets: false, showLib: false }),\n      closeSave: () => this.setState({ showSave: false }),\n      closeSaveBackdrop: (e) => { if (e.target === e.currentTarget) this.setState({ showSave: false }); },\n      confirmSave: this.confirmSave,\n      showSave: st.showSave, showLib: st.showLib, showPresets: st.showPresets,\n      toast: st.toast, toastOn: !!st.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
